<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 CORS 실습</title>
  <style>
    body { max-width: 720px; margin: 48px auto; padding: 0 20px; font-family: sans-serif; line-height: 1.6; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin: 6px 0 16px; }
    button { padding: 10px 16px; margin: 0 8px 12px 0; cursor: pointer; }
    pre { padding: 16px; background: #f1f5f9; white-space: pre-wrap; overflow-wrap: anywhere; }
    code { background: #f1f5f9; }
  </style>
</head>
<body>
  <h1>게시글 CORS 실습</h1>
  <p>현재 페이지 출처: <code id="origin"></code></p>
  <p>기본 허용 출처는 <code>http://localhost:3000</code>입니다.
    <code>http://127.0.0.1:3000/cors-demo.html</code>에서 열면 다른 출처로 요청합니다.</p>
  <label for="api">API 주소</label>
  <input id="api" type="url" value="http://localhost:8080" spellcheck="false">
  <label for="title">새 게시글 제목</label>
  <input id="title" value="브라우저에서 작성한 글">
  <button id="get" type="button">GET 게시글 조회</button>
  <button id="post" type="button">JSON POST 게시글 생성</button>
  <pre id="result" role="status" aria-live="polite">버튼을 눌러 응답을 확인하세요.</pre>
  <p>개발자 도구의 Network에서 JSON POST 직전의 OPTIONS와 응답 헤더를 확인하세요.
    오류 메시지만으로 CORS 오류와 서버 연결 실패를 구분할 수는 없습니다.</p>
  <script>
    const result = document.querySelector('#result');
    document.querySelector('#origin').textContent = location.origin;

    async function request(method) {
      const base = document.querySelector('#api').value.replace(/\/+$/, '');
      const path = method === 'GET' ? '/posts/1' : '/posts';
      const options = { method, credentials: 'omit' };
      if (method === 'POST') {
        options.headers = { 'Content-Type': 'application/json' };
        options.body = JSON.stringify({ title: document.querySelector('#title').value });
      }
      result.textContent = `${method} ${base}${path} 요청 중`;
      try {
        const response = await fetch(base + path, options);
        const body = await response.text();
        result.textContent = `${response.ok ? '성공' : 'HTTP 오류'} ${response.status}\n${body}`;
      } catch (error) {
        result.textContent = `요청 실패: ${error.message}\nNetwork와 서버 로그에서 원인을 확인하세요.`;
      }
    }

    document.querySelector('#get').addEventListener('click', () => request('GET'));
    document.querySelector('#post').addEventListener('click', () => request('POST'));
  </script>
</body>
</html>
